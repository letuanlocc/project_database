<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin_manageService</title>
</head>
<body>
    <form id="serviceForm">

    <label>Tên dịch vụ:</label>
    <input type="text" name="ten" required>

    <br><br>

    <label>Giá:</label>
    <input type="number" name="gia" step="0.01" min="0">

    <br><br>

    <button type="submit">Thêm dịch vụ</button>

</form>
<button onclick = "getAllService()">Xem tất cả dịch vụ</button>

    <div id="result"></div>

<script>
window.getAllService = async function getAllService() {
    const res = await fetch('/admin/service');
    const data = await res.json();

    console.log(data);

    document.getElementById('result').innerHTML =
        data.map(e =>
             `<div>
                ${e.ten} - ${e.gia}
                <button onclick="showEditService(${e.ma_dv}, '${escapeHtml(e.ten)}', ${e.gia || 0})">Sửa</button>
                <button onclick="deleteService(${e.ma_dv})">Xoá</button>
            </div>`
        ).join('');
}
function escapeHtml(str){ if(!str) return ''; return String(str).replace(/'/g, "\\'").replace(/"/g,'\"'); }

function showEditService(id, ten, gia){
    const container = document.getElementById('result');
    const form = document.createElement('div');
    form.innerHTML = `
        <h3>Chỉnh sửa dịch vụ</h3>
        <label>Tên:</label><input id="edit_ten" value="${ten}"><br>
        <label>Giá:</label><input id="edit_gia" type="number" value="${gia}"><br>
        <button onclick="saveEditService(${id})">Lưu</button>
        <button onclick="getAllService()">Hủy</button>
    `;
    container.prepend(form);
}

async function saveEditService(id){
    const ten = document.getElementById('edit_ten').value;
    const gia = document.getElementById('edit_gia').value;
    const payload = { ten, gia };
    const res = await fetch(`/admin/updateService/${id}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Lỗi cập nhật'); return; }
    alert(data.message);
    getAllService();
}
window.deleteService = async function deleteService(id) {
    const res = await fetch(`/admin/deleteService/${id}`, {
        method: 'POST'
    });
    const data = await res.json();
    
    if (!res.ok) {
        alert('Lỗi: ' + (data.error || 'Không thể xoá dịch vụ'));
        return;
    }
    
    alert(data.message);
    getAllService();
}

document.getElementById('serviceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    
    try {
        const res = await fetch('/admin/addService', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (!res.ok) {
            alert('Lỗi: ' + (result.error || 'Không thể thêm dịch vụ'));
            return;
        }
        
        alert(result.message);
        e.target.reset();
        getAllService();
    } catch (error) {
        alert('Lỗi: ' + error.message);
    }
});
</script>
</body>
</html>
