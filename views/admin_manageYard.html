<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin_manageYard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        .yard-row { border: 1px solid #ccc; padding: 10px; margin-bottom: 12px; }
        .yard-row strong { display: block; margin-bottom: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Thêm sân mới</h1>
    <form id="yardForm">
        <label for="ten">Tên sân:</label>
        <input id="ten" type="text" name="ten" required maxlength="100">

        <label for="trangThai">Trạng thái:</label>
        <select id="trangThai" name="trangThai" required>
            <option value="trong">Trống</option>
            <option value="dang_su_dung">Đang sử dụng</option>
            <option value="bao_tri">Bảo trì</option>
        </select>

        <label for="gia">Giá:</label>
        <input id="gia" type="number" name="gia" required min="0" step="0.01">

        <label for="loaiSan">Loại sân:</label>
        <select id="loaiSan" name="loaiSan" required>
            <option value="">-- Chọn loại sân --</option>
            <option value="cau_long">Sân cầu lông</option>
            <option value="bong_da">Sân bóng đá</option>
        </select>

        <div id="badmintonFields" class="hidden">
            <label for="chieuCaoLuoi">Chiều cao lưới (m):</label>
            <input id="chieuCaoLuoi" type="number" name="chieuCaoLuoi" min="0" step="0.01">
        </div>

        <div id="footballFields" class="hidden">
            <label for="chieuDai">Chiều dài sân (m):</label>
            <input id="chieuDai" type="number" name="chieuDai" min="0" step="0.01">
        </div>

        <button type="submit">Thêm sân</button>
    </form>
    <button type="button" onclick="getAllYard()">Xem tất cả sân</button>

    <div id="result"></div>

<script>
    const loaiSanSelect = document.getElementById('loaiSan');
    const badmintonFields = document.getElementById('badmintonFields');
    const footballFields = document.getElementById('footballFields');

    loaiSanSelect.addEventListener('change', () => {
        const value = loaiSanSelect.value;
        badmintonFields.classList.toggle('hidden', value !== 'cau_long');
        footballFields.classList.toggle('hidden', value !== 'bong_da');

        if (value !== 'cau_long') {
            document.getElementById('chieuCaoLuoi').value = '';
        }
        if (value !== 'bong_da') {
            document.getElementById('chieuDai').value = '';
        }
    });

    async function getAllYard() {
        const res = await fetch('/admin/yard');
        const data = await res.json();

        document.getElementById('result').innerHTML = data.length === 0
            ? '<p>Chưa có sân nào.</p>'
            : data.map((e) => {
                const typeLabel = e.loaiSan === 'cau_long' ? 'Sân cầu lông' : e.loaiSan === 'bong_da' ? 'Sân bóng đá' : 'Không xác định';
                const extra = e.loaiSan === 'cau_long'
                    ? `Chiều cao lưới: ${e.chieuCaoLuoi || '-'} m`
                    : e.loaiSan === 'bong_da'
                        ? `Chiều dài: ${e.chieuDai || '-'} m`
                        : '';

                return `<div class="yard-row">
                    <strong>${e.ten}</strong>
                    <div>Loại sân: ${typeLabel}</div>
                    <div>Trạng thái: ${e.trangThai}</div>
                    <div>Giá: ${e.gia}</div>
                    <div>${extra}</div>
                    <button type="button" onclick="showEditYard(${e.ma_san}, '${escapeHtml(e.ten)}', '${e.trangThai}', ${e.gia}, '${e.loaiSan || ''}', ${e.chieuCaoLuoi || ''}, ${e.chieuDai || ''})">Sửa</button>
                    <button type="button" onclick="deleteYard(${e.ma_san})">Xoá</button>
                </div>`;
            }).join('');
    }

function escapeHtml(str){ if(!str) return ''; return String(str).replace(/'/g, "\\'").replace(/"/g,'\"'); }

function showEditYard(id, ten, trangThai, gia, loaiSan, chieuCaoLuoi, chieuDai){
    const container = document.getElementById('result');
    const form = document.createElement('div');
    form.className = 'yard-row';
    form.innerHTML = `
        <h3>Chỉnh sửa sân</h3>
        <label>Tên:</label><input id="edit_ten" value="${ten}"><br>
        <label>Trạng thái:</label>
        <select id="edit_trangThai"><option value="trong">Trống</option><option value="dang_su_dung">Đang sử dụng</option><option value="bao_tri">Bảo trì</option></select><br>
        <label>Giá:</label><input id="edit_gia" type="number" value="${gia}"><br>
        <label>Loại sân:</label>
        <select id="edit_loaiSan"><option value="">-- Chọn --</option><option value="cau_long">Sân cầu lông</option><option value="bong_da">Sân bóng đá</option></select><br>
        <div id="edit_badmintonFields"><label>Chiều cao lưới (m):</label><input id="edit_chieuCaoLuoi" type="number" value="${chieuCaoLuoi || ''}"></div>
        <div id="edit_footballFields"><label>Chiều dài (m):</label><input id="edit_chieuDai" type="number" value="${chieuDai || ''}"></div>
        <button onclick="saveEditYard(${id})">Lưu</button>
        <button onclick="getAllYard()">Hủy</button>
    `;
    container.prepend(form);
    document.getElementById('edit_trangThai').value = trangThai;
    document.getElementById('edit_loaiSan').value = loaiSan || '';
    const b = document.getElementById('edit_badmintonFields');
    const f = document.getElementById('edit_footballFields');
    b.style.display = loaiSan === 'cau_long' ? '' : 'none';
    f.style.display = loaiSan === 'bong_da' ? '' : 'none';
    document.getElementById('edit_loaiSan').addEventListener('change', (ev)=>{
        const v = ev.target.value;
        b.style.display = v === 'cau_long' ? '' : 'none';
        f.style.display = v === 'bong_da' ? '' : 'none';
    });
}

async function saveEditYard(id){
    const ten = document.getElementById('edit_ten').value;
    const trangThai = document.getElementById('edit_trangThai').value;
    const gia = document.getElementById('edit_gia').value;
    const loaiSan = document.getElementById('edit_loaiSan').value;
    const chieuCaoLuoi = document.getElementById('edit_chieuCaoLuoi')?.value;
    const chieuDai = document.getElementById('edit_chieuDai')?.value;
    const payload = { ten, trangThai, gia, loaiSan };
    if (loaiSan === 'cau_long') payload.chieuCaoLuoi = chieuCaoLuoi;
    if (loaiSan === 'bong_da') payload.chieuDai = chieuDai;
    const res = await fetch(`/admin/updateYard/${id}`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Lỗi cập nhật'); return; }
    alert(data.message);
    getAllYard();
}

    async function deleteYard(id) {
        const res = await fetch(`/admin/deleteYard/${id}`, { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
            alert('Lỗi: ' + (data.error || 'Không thể xoá sân'));
            return;
        }

        alert(data.message);
        getAllYard();
    }

    document.getElementById('yardForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);

        try {
            const res = await fetch('/admin/addYard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (!res.ok) {
                alert('Lỗi: ' + (result.error || 'Không thể thêm sân'));
                return;
            }

            alert(result.message);
            e.target.reset();
            badmintonFields.classList.add('hidden');
            footballFields.classList.add('hidden');
            getAllYard();
        } catch (error) {
            alert('Lỗi: ' + error.message);
        }
    });

    getAllYard();
</script>
</body>
</html>
